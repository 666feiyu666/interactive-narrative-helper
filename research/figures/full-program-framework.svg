<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080" role="img" aria-labelledby="title desc">
  <title id="title">Interactive Narrative Helper full research framework</title>
  <desc id="desc">The Interactive Narrative Helper connects an evidence landscape to Track A macro educational design exploration, an educator- or author-reviewed design brief, and Track B story-level narrative technique exploration. Track B frames inspectable transformations of events and consequences, perspective and information, time and sequence, or role and agency. The author retains decision authority, and the two tracks have separate evaluation boundaries.</desc>

  <defs>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="136%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#172033" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#263247"/>
    </marker>
    <style>
      .title { font: 700 38px Inter, "Segoe UI", Arial, sans-serif; fill: #172033; }
      .subtitle { font: 400 22px Inter, "Segoe UI", Arial, sans-serif; fill: #526071; }
      .eyebrow { font: 700 15px Inter, "Segoe UI", Arial, sans-serif; letter-spacing: 1.8px; fill: #526071; }
      .panel-title { font: 700 30px Inter, "Segoe UI", Arial, sans-serif; fill: #172033; }
      .card-title { font: 700 20px Inter, "Segoe UI", Arial, sans-serif; fill: #172033; }
      .body { font: 400 18px Inter, "Segoe UI", Arial, sans-serif; fill: #425166; }
      .small { font: 400 16px Inter, "Segoe UI", Arial, sans-serif; fill: #59677a; }
      .badge { font: 700 20px Inter, "Segoe UI", Arial, sans-serif; fill: #172033; }
      .chip { font: 600 15px Inter, "Segoe UI", Arial, sans-serif; fill: #4b3e64; }
      .eval-title { font: 700 23px Inter, "Segoe UI", Arial, sans-serif; fill: #172033; }
      .arrow { fill: none; stroke: #263247; stroke-width: 4; marker-end: url(#arrow); }
      .card { fill: #ffffff; stroke: #2d3748; stroke-width: 2.4; }
    </style>
  </defs>

  <rect width="1800" height="1080" fill="#ffffff"/>

  <!-- Header -->
  <g filter="url(#shadow)">
    <rect x="40" y="30" width="1720" height="112" rx="26" fill="#f1f3f6" stroke="#263247" stroke-width="2.5"/>
  </g>
  <text x="78" y="78" class="title">Interactive Narrative Helper</text>
  <text x="78" y="116" class="subtitle">Two evidence-grounded design-time levels, connected by an educator- or author-reviewed brief</text>
  <text x="1720" y="77" text-anchor="end" class="eyebrow">FULL RESEARCH FRAMEWORK</text>

  <!-- Evidence landscape -->
  <g filter="url(#shadow)">
    <rect x="40" y="180" width="300" height="650" rx="28" fill="#e7f1f8"/>
  </g>
  <circle cx="84" cy="225" r="25" fill="#96c5e3"/>
  <text x="84" y="232" text-anchor="middle" class="badge">E</text>
  <text x="120" y="213" class="eyebrow">EVIDENCE</text>
  <text x="120" y="247" class="panel-title">Landscape</text>

  <rect x="68" y="280" width="244" height="118" rx="18" class="card"/>
  <text x="90" y="316" class="card-title">Educational interactive</text>
  <text x="90" y="344" class="card-title">narratives</text>
  <text x="90" y="375" class="body">across distribution contexts</text>

  <rect x="68" y="426" width="244" height="162" rx="18" class="card"/>
  <text x="90" y="462" class="card-title">Evidence layers</text>
  <text x="90" y="498" class="body">public project records</text>
  <text x="90" y="530" class="body">creator descriptions</text>
  <text x="90" y="562" class="body">artifacts or documents</text>

  <rect x="68" y="616" width="244" height="150" rx="18" fill="#d9eaf5" stroke="#5f7f99" stroke-width="2"/>
  <text x="90" y="652" class="card-title">Evidence control</text>
  <text x="90" y="688" class="body">provenance · rights</text>
  <text x="90" y="720" class="body">coverage · inclusion</text>
  <text x="90" y="752" class="body">claim-to-source fit</text>
  <text x="56" y="807" class="small">No single source layer defines the field.</text>

  <!-- Track A -->
  <g filter="url(#shadow)">
    <rect x="390" y="180" width="440" height="650" rx="28" fill="#eaf3e5"/>
  </g>
  <circle cx="434" cy="225" r="25" fill="#a7ce83"/>
  <text x="434" y="232" text-anchor="middle" class="badge">A</text>
  <text x="470" y="213" class="eyebrow">TRACK A</text>
  <text x="470" y="247" class="panel-title">Macro design exploration</text>

  <rect x="420" y="280" width="380" height="178" rx="20" class="card"/>
  <text x="446" y="318" class="card-title">Evidence and knowledge cycle</text>
  <text x="446" y="354" class="body">construct and examine corpora</text>
  <text x="446" y="386" class="body">discover and validate knowledge</text>
  <text x="446" y="418" class="body">organize, ground, evaluate, reflect</text>
  <text x="446" y="444" class="small">traceable claims · uncertainty retained</text>

  <path d="M 610 458 L 610 490" class="arrow"/>

  <rect x="420" y="500" width="380" height="142" rx="20" fill="#dceecd" stroke="#64814e" stroke-width="2.2"/>
  <text x="446" y="538" class="card-title">Traceable design knowledge</text>
  <text x="446" y="574" class="body">precedents · types · combinations</text>
  <text x="446" y="606" class="small">conditions, gaps, and source links retained</text>

  <path d="M 610 642 L 610 674" class="arrow"/>

  <rect x="420" y="684" width="380" height="120" rx="20" class="card"/>
  <text x="446" y="722" class="card-title">Educational Interactive Narrative</text>
  <text x="446" y="750" class="card-title">Design Helper</text>
  <text x="446" y="778" class="small">compares grounded directions</text>
  <text x="446" y="798" class="small">does not prescribe one design</text>

  <!-- Human review gate -->
  <g filter="url(#shadow)">
    <rect x="880" y="180" width="280" height="650" rx="28" fill="#fff2dd"/>
  </g>
  <circle cx="924" cy="225" r="25" fill="#efbd66"/>
  <text x="924" y="232" text-anchor="middle" class="badge">H</text>
  <text x="960" y="213" class="eyebrow">HUMAN GATE</text>
  <text x="960" y="247" class="panel-title">Reviewed brief</text>

  <rect x="910" y="280" width="220" height="366" rx="20" class="card"/>
  <text x="934" y="318" class="card-title">Selected direction</text>
  <text x="934" y="358" class="body">• topic and purpose</text>
  <text x="934" y="392" class="body">• audience and context</text>
  <text x="934" y="426" class="body">• interaction pattern</text>
  <text x="934" y="460" class="body">• supporting precedents</text>
  <text x="934" y="494" class="body">• author constraints</text>
  <text x="934" y="528" class="body">• story choice</text>
  <text x="934" y="562" class="body">• technique framing</text>
  <line x1="934" y1="584" x2="1106" y2="584" stroke="#df9d36" stroke-width="2"/>
  <text x="934" y="612" class="small">review · revise</text>
  <text x="934" y="634" class="small">combine · reject</text>

  <rect x="910" y="666" width="220" height="128" rx="20" fill="#ffe4b5" stroke="#ac7626" stroke-width="2"/>
  <text x="1020" y="705" text-anchor="middle" class="card-title">Decision authority</text>
  <text x="1020" y="741" text-anchor="middle" class="body">educator / author</text>
  <text x="1020" y="773" text-anchor="middle" class="small">not either Helper</text>

  <!-- Track B -->
  <g filter="url(#shadow)">
    <rect x="1210" y="180" width="550" height="650" rx="28" fill="#eee8f8"/>
  </g>
  <circle cx="1254" cy="225" r="25" fill="#aa8bd4"/>
  <text x="1254" y="232" text-anchor="middle" class="badge">B</text>
  <text x="1290" y="209" class="eyebrow">TRACK B</text>
  <text x="1290" y="242" class="panel-title">Story-level narrative</text>
  <text x="1290" y="274" class="panel-title">technique exploration</text>

  <rect x="1240" y="296" width="490" height="118" rx="20" class="card"/>
  <text x="1266" y="334" class="card-title">Concrete story case + reviewed direction</text>
  <text x="1266" y="370" class="body">story situation · design intention · invariants</text>
  <text x="1266" y="400" class="small">permitted changes · technique framing · exploration bounds</text>

  <path d="M 1485 414 L 1485 446" class="arrow"/>

  <rect x="1240" y="456" width="490" height="194" rx="20" fill="#dfd3f0" stroke="#71579a" stroke-width="2.2"/>
  <text x="1266" y="494" class="card-title">Narrative Technique Design Partner</text>
  <text x="1266" y="528" class="body">frames inspectable, technique-specific transformations</text>
  <rect x="1266" y="552" width="206" height="34" rx="17" fill="#f6f2fb" stroke="#9b84bd" stroke-width="1.5"/>
  <text x="1369" y="574" text-anchor="middle" class="chip">events &amp; consequences</text>
  <rect x="1486" y="552" width="218" height="34" rx="17" fill="#f6f2fb" stroke="#9b84bd" stroke-width="1.5"/>
  <text x="1595" y="574" text-anchor="middle" class="chip">perspective &amp; information</text>
  <rect x="1266" y="598" width="206" height="34" rx="17" fill="#f6f2fb" stroke="#9b84bd" stroke-width="1.5"/>
  <text x="1369" y="620" text-anchor="middle" class="chip">time &amp; sequence</text>
  <rect x="1486" y="598" width="218" height="34" rx="17" fill="#f6f2fb" stroke="#9b84bd" stroke-width="1.5"/>
  <text x="1595" y="620" text-anchor="middle" class="chip">role &amp; agency</text>

  <path d="M 1485 650 L 1485 682" class="arrow"/>

  <rect x="1240" y="692" width="490" height="128" rx="20" class="card"/>
  <text x="1266" y="730" class="card-title">Author-controlled narrative development</text>
  <text x="1266" y="764" class="body">compare · revise · combine · reject</text>
  <text x="1266" y="792" class="small">selected directions continue to branch, scene,</text>
  <text x="1266" y="814" class="small">or interaction design</text>

  <!-- Main flow arrows -->
  <path d="M 340 505 L 380 505" class="arrow"/>
  <path d="M 830 505 L 870 505" class="arrow"/>
  <path d="M 1160 505 L 1200 505" class="arrow"/>

  <!-- Separate evaluation boundaries -->
  <rect x="40" y="875" width="790" height="160" rx="24" fill="#f1f7ed" stroke="#7ea06d" stroke-width="2"/>
  <text x="72" y="910" class="eyebrow">SEPARATE EVALUATION · TRACK A</text>
  <text x="72" y="950" class="eval-title">Does it help people compare and select grounded macro directions?</text>
  <text x="72" y="988" class="body">relevance · diversity · traceability · comprehensibility · design utility</text>
  <text x="72" y="1018" class="small">Creator-described patterns remain positioning claims, not measured learning effects.</text>

  <rect x="880" y="875" width="880" height="160" rx="24" fill="#f5f1fa" stroke="#9275b8" stroke-width="2"/>
  <text x="912" y="910" class="eyebrow">SEPARATE EVALUATION · TRACK B</text>
  <text x="912" y="944" class="eval-title">Does it expand how a concrete story can be experienced,</text>
  <text x="912" y="972" class="eval-title">interpreted, and developed with author control?</text>
  <text x="912" y="1002" class="body">source compatibility · substantive transformation · interactive potential · inspectability</text>
  <text x="912" y="1027" class="small">Meaning projection and author utility remain shared concerns; each technique requires its own criteria and evidence.</text>
</svg>
